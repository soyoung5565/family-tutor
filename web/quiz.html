<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>课后测验 — 编程基础</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #121212;
      --surface-2: #1a1a1a;
      --fg: #e8e8e8;
      --muted: #888888;
      --border: rgba(255,255,255,0.06);
      --accent: #6366f1;
      --accent-dim: rgba(99,102,241,0.15);
      --accent-glow: rgba(99,102,241,0.25);
      --success: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
      --radius: 12px;
      --radius-lg: 16px;
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection { background: var(--accent-dim); color: var(--fg); }

    .app {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 40px;
      gap: 24px;
    }
    .header-left h1 {
      font: 600 26px/1.2 var(--font-display);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .header-left p {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.01em;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--accent-dim);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 999px;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .header-badge svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Progress */
    .progress-wrap {
      margin-bottom: 36px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }
    .progress-track {
      width: 100%; height: 4px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      width: 0%;
    }

    /* Question card */
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    .q-card:focus-within {
      border-color: rgba(99,102,241,0.3);
    }
    .q-card.correct {
      border-color: rgba(34,197,94,0.3);
      background: linear-gradient(135deg, rgba(34,197,94,0.04), transparent);
    }
    .q-card.wrong {
      border-color: rgba(239,68,68,0.3);
      background: linear-gradient(135deg, rgba(239,68,68,0.04), transparent);
    }

    .q-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .q-type {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .q-type.choice { background: var(--accent-dim); color: var(--accent); }
    .q-type.text { background: rgba(245,158,11,0.12); color: var(--warn); }
    .q-point {
      color: var(--muted);
      margin-left: auto;
    }

    .q-text {
      font: 500 16px/1.5 var(--font-display);
      letter-spacing: -0.01em;
      margin-bottom: 20px;
    }

    /* Options - multiple choice */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .choice {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 15px;
      line-height: 1.4;
    }
    .choice:hover {
      border-color: rgba(99,102,241,0.25);
      background: rgba(99,102,241,0.04);
    }
    .choice.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .choice.correct {
      border-color: var(--success) !important;
      background: rgba(34,197,94,0.08) !important;
    }
    .choice.wrong {
      border-color: var(--danger) !important;
      background: rgba(239,68,68,0.08) !important;
    }
    .choice.disabled {
      pointer-events: none;
      opacity: 0.7;
    }
    .choice.disabled.correct { opacity: 1; }
    .choice.disabled.wrong { opacity: 1; }

    .choice-indicator {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      transition: all 0.2s;
    }
    .choice.multi .choice-indicator { border-radius: 4px; }
    .choice.selected .choice-indicator {
      border-color: var(--accent);
      background: var(--accent);
    }
    .choice.selected .choice-indicator::after {
      content: '';
      width: 8px; height: 8px;
      background: #fff;
      border-radius: 50%;
    }
    .choice.multi.selected .choice-indicator::after {
      border-radius: 1px;
      width: 10px; height: 10px;
    }
    .choice.correct .choice-indicator {
      border-color: var(--success) !important;
      background: var(--success) !important;
    }
    .choice.wrong .choice-indicator {
      border-color: var(--danger) !important;
      background: var(--danger) !important;
    }

    /* Short answer */
    .sa-input {
      width: 100%;
      min-height: 100px;
      padding: 16px 18px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--fg);
      font: 15px/1.6 var(--font-mono);
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    .sa-input:focus {
      border-color: rgba(99,102,241,0.4);
    }
    .sa-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Answer feedback */
    .answer-feedback {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      display: none;
    }
    .answer-feedback.show { display: block; }
    .answer-feedback.is-right {
      background: rgba(34,197,94,0.06);
      border: 1px solid rgba(34,197,94,0.15);
    }
    .answer-feedback.is-wrong {
      background: rgba(239,68,68,0.06);
      border: 1px solid rgba(239,68,68,0.15);
    }
    .answer-feedback.is-neutral {
      background: rgba(99,102,241,0.06);
      border: 1px solid rgba(99,102,241,0.15);
    }
    .answer-feedback .fb-label {
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    .answer-feedback .fb-label.is-right { color: var(--success); }
    .answer-feedback .fb-label.is-wrong { color: var(--danger); }
    .answer-feedback .fb-label.is-neutral { color: var(--accent); }
    .answer-feedback .fb-ref {
      color: var(--muted);
      font-size: 13px;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 40px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border: none;
      border-radius: var(--radius);
      font: 500 14px/1 var(--font-body);
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #5558e6; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      border-color: rgba(255,255,255,0.12);
      color: var(--fg);
    }

    /* Results panel */
    .results-panel {
      display: none;
      margin-top: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px;
    }
    .results-panel.show { display: block; }

    .result-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .result-score {
      font: 700 56px/1 var(--font-display);
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }
    .result-score.pass { color: var(--success); }
    .result-score.fail { color: var(--danger); }
    .result-label {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    .result-stats {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-top: 24px;
    }
    .result-stat {
      text-align: center;
    }
    .result-stat .num {
      font: 600 24px/1 var(--font-display);
      letter-spacing: -0.02em;
    }
    .result-stat .num.correct-num { color: var(--success); }
    .result-stat .num.wrong-num { color: var(--danger); }
    .result-stat .lbl {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Weak points */
    .weak-section {
      margin-top: 36px;
    }
    .weak-section h3 {
      font: 600 16px/1.2 var(--font-display);
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .weak-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .weak-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.15);
      border-radius: 999px;
      font-size: 13px;
      color: var(--danger);
    }
    .weak-chip.strong {
      background: rgba(34,197,94,0.08);
      border-color: rgba(34,197,94,0.15);
      color: var(--success);
    }
    .weak-chip.medium {
      background: rgba(245,158,11,0.08);
      border-color: rgba(245,158,11,0.15);
      color: var(--warn);
    }

    /* Answer review list */
    .review-list {
      margin-top: 36px;
    }
    .review-list h3 {
      font: 600 16px/1.2 var(--font-display);
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }
    .review-item {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .review-item:last-child { border-bottom: none; }
    .review-idx {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .review-idx.idx-right { background: rgba(34,197,94,0.12); color: var(--success); }
    .review-idx.idx-wrong { background: rgba(239,68,68,0.12); color: var(--danger); }
    .review-body .q { color: var(--fg); margin-bottom: 4px; }
    .review-body .a { color: var(--muted); font-size: 13px; }
    .review-body .a strong { color: var(--fg); font-weight: 500; }

    /* Empty state */
    .empty-state {
      display: none;
      text-align: center;
      padding: 80px 24px;
    }
    .empty-state.show { display: block; }
    .empty-state .icon { font-size: 40px; margin-bottom: 16px; }
    .empty-state h2 { font: 600 20px/1.3 var(--font-display); margin-bottom: 8px; }
    .empty-state p { color: var(--muted); font-size: 14px; }

    /* Responsive */
    @media (max-width: 640px) {
      .app { padding: 24px 16px 60px; }
      .header { flex-direction: column; }
      .q-card { padding: 20px; }
      .choice { padding: 12px 14px; font-size: 14px; }
      .results-panel { padding: 24px; }
      .result-score { font-size: 42px; }
      .result-stats { gap: 16px; }
      .actions { flex-direction: column; align-items: stretch; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>

<div class="app" id="app">

  <!-- Header -->
  <header class="header" data-od-id="header">
    <div class="header-left">
      <h1 data-od-id="header-title">课后测验</h1>
      <p data-od-id="header-subtitle" id="header-subtitle">编程基础 · 共 <strong id="total-q-count">0</strong> 题</p>
    </div>
    <div class="header-badge">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      知识测验
    </div>
  </header>

  <!-- Progress -->
  <div class="progress-wrap" data-od-id="progress-wrap">
    <div class="progress-header">
      <span id="progress-label">答题进度</span>
      <span id="progress-text">0 / 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Questions container -->
  <div id="questions-container"></div>

  <!-- Actions -->
  <div class="actions" id="actions" data-od-id="actions">
    <button class="btn btn-primary" id="btn-submit" data-od-id="btn-submit">提交答案</button>
    <button class="btn btn-secondary" id="btn-reset" data-od-id="btn-reset" style="display:none;">重新测验</button>
  </div>

  <!-- Results -->
  <div class="results-panel" id="results-panel" data-od-id="results-panel">
    <div class="result-header">
      <div class="result-score" id="result-score" data-od-id="result-score">0</div>
      <div class="result-label" id="result-label">正在评分…</div>
      <div class="result-stats">
        <div class="result-stat">
          <div class="num correct-num" id="correct-count">0</div>
          <div class="lbl">正确</div>
        </div>
        <div class="result-stat">
          <div class="num wrong-num" id="wrong-count">0</div>
          <div class="lbl">错误</div>
        </div>
        <div class="result-stat">
          <div class="num" id="accuracy-display" style="color:var(--muted)">0%</div>
          <div class="lbl">正确率</div>
        </div>
      </div>
    </div>

    <div class="weak-section" id="weak-section" data-od-id="weak-section">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        知识点掌握情况
      </h3>
      <div class="weak-grid" id="weak-grid"></div>
    </div>

    <div class="review-list" id="review-list" data-od-id="review-list">
      <h3>逐题回顾</h3>
      <div id="review-items"></div>
    </div>
  </div>

</div>

<script>
(function() {
  // ---- Quiz data ----
    var QUESTIONS = [
    {
      id: 'q1',
      type: 'choice',
      multi: false,
      topic: '古诗词常识',
      text: '《宿建德江》的作者是哪位唐代诗人？',
      options: ['李白', '杜甫', '孟浩然', '白居易'],
      answer: 2,
    },
    {
      id: 'q2',
      type: 'choice',
      multi: false,
      topic: '诗词理解',
      text: '「野旷天低树，江清月近人」这两句诗主要表达了诗人怎样的感受？',
      options: ['对自然美景的单纯赞美', '身处异乡、孤独愁闷的羁旅之情', '获得升迁后的轻松与喜悦', '与友人重逢的激动心情'],
      answer: 1,
    },
    {
      id: 'q3',
      type: 'choice',
      multi: false,
      topic: '古诗词常识',
      text: '《西江月·夜行黄沙道中》的作者是哪位宋代词人？',
      options: ['李白', '辛弃疾', '苏轼', '陆游'],
      answer: 1,
    },
    {
      id: 'q4',
      type: 'choice',
      multi: false,
      topic: '词句理解',
      text: '「明月别枝惊鹊」中「别枝」的意思是？',
      options: ['离开树枝', '横斜的树枝', '另一根树枝', '独特的树枝'],
      answer: 1,
    },
    {
      id: 'q5',
      type: 'choice',
      multi: false,
      topic: '生字拼音',
      text: '「移舟泊烟渚」中「渚」的正确读音是？',
      options: ['zhǔ', 'zhù', 'zǔ', 'zù'],
      answer: 0,
    },
    {
      id: 'q6',
      type: 'choice',
      multi: false,
      topic: '字词解释',
      text: '「渚」在诗中的意思是？',
      options: ['水中间的小块陆地', '河流的岸边', '大海中的岛屿', '湖泊的中心'],
      answer: 0,
    },
    {
      id: 'q7',
      type: 'choice',
      multi: false,
      topic: '古诗词常识',
      text: '《六月二十七日望湖楼醉书》的作者是哪个朝代的？',
      options: ['唐代', '宋代', '元代', '明代'],
      answer: 1,
    },
    {
      id: 'q8',
      type: 'choice',
      multi: false,
      topic: '生字拼音',
      text: '「路转溪桥忽见」中「见」的正确读音是？',
      options: ['jiàn', 'xiàn', 'jiān', 'xiān'],
      answer: 1,
    },
    {
      id: 'q9',
      type: 'text',
      multi: false,
      topic: '诗词赏析',
      text: '苏轼的《六月二十七日望湖楼醉书》生动描绘了一幅夏日西湖骤雨图。请结合诗句，用自己的话描述这首诗描绘的景象。',
      answer: '诗人描绘了西湖夏日骤雨的景象。乌云像打翻的墨汁一样翻滚，但还没有完全遮住山峦；白色的雨点像珍珠一样跳入船中。忽然一阵卷地风来，吹散了乌云，望湖楼下水面又恢复了平静，像天空一样开阔。',
      keywords: ['乌云', '墨汁', '雨点', '珍珠', '风', '吹散', '平静'],
    },
    {
      id: 'q10',
      type: 'text',
      multi: false,
      topic: '诗词对比',
      text: '《宿建德江》和《西江月·夜行黄沙道中》都写了月夜的景色，但表达的情感却不同。请结合具体诗句，简要说明两首诗词在情感上的主要差异。',
      answer: '《宿建德江》通过「野旷天低树，江清月近人」等景物描写，抒发了诗人羁旅在外、孤寂愁闷的情感。《西江月·夜行黄沙道中》通过描绘「稻花香里说丰年，听取蛙声一片」以及「路转溪桥忽见」的惊喜，表达了作者对田园生活的热爱、对丰收在望的喜悦以及轻松愉快的心情。',
      keywords: ['羁旅', '孤寂', '田园', '喜悦', '丰收'],
    },
  ];

  var TOPIC_WEIGHTS = {};
  QUESTIONS.forEach(function(q) {
    if (!TOPIC_WEIGHTS[q.topic]) TOPIC_WEIGHTS[q.topic] = { total: 0, correct: 0 };
    TOPIC_WEIGHTS[q.topic].total++;
  });

  var state = {
    answers: {},
    submitted: false,
    score: 0,
    total: QUESTIONS.length,
  };

  // ---- Init ----
  var container = document.getElementById('questions-container');
  var totalEl = document.getElementById('total-q-count');
  var progressFill = document.getElementById('progress-fill');
  var progressText = document.getElementById('progress-text');
  var btnSubmit = document.getElementById('btn-submit');
  var btnReset = document.getElementById('btn-reset');
  var resultsPanel = document.getElementById('results-panel');

  totalEl.textContent = QUESTIONS.length;

  function renderQuestions() {
    var html = '';
    QUESTIONS.forEach(function(q, i) {
      var typeLabel = q.type === 'choice' ? (q.multi ? '多选题' : '单选题') : '简答题';
      var typeClass = q.type === 'choice' ? 'choice' : 'text';
      html += '<div class="q-card" data-qid="' + q.id + '" id="card-' + q.id + '">';
      html += '<div class="q-meta">';
      html += '<span class="q-type ' + typeClass + '">' + typeLabel + '</span>';
      html += '<span style="color:var(--muted);font-size:12px;">' + q.topic + '</span>';
      html += '<span class="q-point">第 ' + (i + 1) + ' 题</span>';
      html += '</div>';
      html += '<div class="q-text">' + q.text + '</div>';

      if (q.type === 'choice') {
        html += '<div class="choices" data-qid="' + q.id + '" data-multi="' + (q.multi ? '1' : '0') + '">';
        q.options.forEach(function(opt, oi) {
          html += '<div class="choice' + (q.multi ? ' multi' : '') + '" data-index="' + oi + '" tabindex="0" role="' + (q.multi ? 'checkbox' : 'radio') + '">';
          html += '<span class="choice-indicator"></span>';
          html += '<span>' + opt + '</span>';
          html += '</div>';
        });
        html += '</div>';
      } else {
        html += '<textarea class="sa-input" data-qid="' + q.id + '" placeholder="在此输入你的回答…" rows="4"></textarea>';
      }

      html += '<div class="answer-feedback" id="fb-' + q.id + '"></div>';
      html += '</div>';
    });
    container.innerHTML = html;
  }
  renderQuestions();

  // ---- Event binding ----
  // Choice clicks
  container.addEventListener('click', function(e) {
    var choice = e.target.closest('.choice');
    if (!choice || state.submitted) return;
    var choicesWrap = choice.closest('.choices');
    var qid = choicesWrap.dataset.qid;
    var multi = choicesWrap.dataset.multi === '1';
    var idx = parseInt(choice.dataset.index, 10);

    if (multi) {
      choice.classList.toggle('selected');
      var selected = [];
      choicesWrap.querySelectorAll('.choice').forEach(function(c) {
        if (c.classList.contains('selected')) selected.push(parseInt(c.dataset.index, 10));
      });
      state.answers[qid] = selected;
    } else {
      choicesWrap.querySelectorAll('.choice').forEach(function(c) { c.classList.remove('selected'); });
      choice.classList.add('selected');
      state.answers[qid] = idx;
    }
    updateProgress();
  });

  // Text input
  container.addEventListener('input', function(e) {
    if (e.target.classList.contains('sa-input') && !state.submitted) {
      state.answers[e.target.dataset.qid] = e.target.value;
      updateProgress();
    }
  });

  // ---- Progress ----
  function updateProgress() {
    var answered = 0;
    QUESTIONS.forEach(function(q) {
      var a = state.answers[q.id];
      if (q.type === 'choice') {
        if (a !== undefined && a !== null && a !== '') {
          if (Array.isArray(a)) { if (a.length > 0) answered++; }
          else answered++;
        }
      } else {
        if (a && a.trim().length > 0) answered++;
      }
    });
    var pct = state.total > 0 ? (answered / state.total) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressText.textContent = answered + ' / ' + state.total;
  }
  updateProgress();

  // ---- AI Grading Function ----
  async function gradeEssayWithAI(question, userAnswer, referenceAnswer, subject) {
    try {
      const response = await fetch('http://localhost:8765/api/grade-essay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: question,
          userAnswer: userAnswer,
          referenceAnswer: referenceAnswer,
          subject: subject || '语文'
        })
      });
      
      if (response.ok) {
        const result = await response.json();
        if (result.status === 'ok' && result.grading) {
          return result.grading;
        }
      }
      
      // 如果 AI 批改失败，返回默认结果
      return {
        is_correct: false,
        score: 0,
        error_reason: 'AI 批改失败，请参考答案',
        reference_answer: referenceAnswer,
        process_issues: '',
        suggestions: '请参考正确答案'
      };
    } catch (error) {
      console.error('AI 批改错误:', error);
      return {
        is_correct: false,
        score: 0,
        error_reason: 'AI 批改失败，请参考答案',
        reference_answer: referenceAnswer,
        process_issues: '',
        suggestions: '请参考正确答案'
      };
    }
  }

  // ---- Submit / Grade ----
  btnSubmit.addEventListener('click', async function() {
    if (state.submitted) return;
    state.submitted = true;

    var score = 0;
    var correctCount = 0;
    var wrongCount = 0;

    QUESTIONS.forEach(function(q) {
      var userAns = state.answers[q.id];
      var correct = false;

      if (q.type === 'choice') {
        if (q.multi) {
          if (Array.isArray(userAns) && Array.isArray(q.answer) && userAns.length === q.answer.length) {
            var sortedUser = userAns.slice().sort();
            var sortedAns = q.answer.slice().sort();
            correct = sortedUser.every(function(v, i) { return v === sortedAns[i]; });
          }
        } else {
          correct = userAns === q.answer;
        }
      } else {
        // short answer — keyword matching
        if (userAns && userAns.trim().length > 0) {
          var lower = userAns.toLowerCase();
          var matchCount = 0;
          q.keywords.forEach(function(kw) {
            if (lower.indexOf(kw.toLowerCase()) !== -1) matchCount++;
          });
          correct = matchCount >= Math.ceil(q.keywords.length * 0.5);
        }
      }

      // Visual feedback
      var card = document.getElementById('card-' + q.id);
      var fb = document.getElementById('fb-' + q.id);

      if (q.type === 'choice') {
        var choicesWrap = card.querySelector('.choices');
        choicesWrap.querySelectorAll('.choice').forEach(function(c) {
          c.classList.add('disabled');
          var ci = parseInt(c.dataset.index, 10);
          if (q.multi) {
            if (q.answer.indexOf(ci) !== -1) c.classList.add('correct');
            else if (c.classList.contains('selected')) c.classList.add('wrong');
          } else {
            if (ci === q.answer) c.classList.add('correct');
            else if (c.classList.contains('selected')) c.classList.add('wrong');
          }
        });
      } else {
        var textarea = card.querySelector('.sa-input');
        textarea.disabled = true;
      }

      if (correct) {
        correctCount++;
        score++;
        card.classList.add('correct');
        if (fb) {
          fb.className = 'answer-feedback show is-right';
          fb.innerHTML = '<span class="fb-label is-right">回答正确</span>';
        }
      } else {
        wrongCount++;
        card.classList.add('wrong');
        if (fb) {
          var label = q.type === 'text' ? '参考答案' : '正确答案';
          var ansText = q.type === 'text' ? q.answer : q.options[q.answer];
          if (q.multi) {
            ansText = q.answer.map(function(i) { return q.options[i]; }).join('、');
          }
          fb.className = 'answer-feedback show is-wrong';
          fb.innerHTML = '<span class="fb-label is-wrong">回答不正确</span><div class="fb-ref">' + label + '：' + ansText + '</div>';
        }
      }

      // Update topic weights
      if (TOPIC_WEIGHTS[q.topic]) {
        TOPIC_WEIGHTS[q.topic].correct += correct ? 1 : 0;
      }
    });

    state.score = score;

    // Show results
    var scoreEl = document.getElementById('result-score');
    var labelEl = document.getElementById('result-label');
    var accuracy = state.total > 0 ? Math.round((correctCount / state.total) * 100) : 0;

    scoreEl.textContent = score + ' / ' + state.total;
    scoreEl.className = 'result-score ' + (accuracy >= 60 ? 'pass' : 'fail');
    labelEl.textContent = accuracy >= 90 ? '优秀！掌握非常扎实' :
                          accuracy >= 70 ? '良好，仍有提升空间' :
                          accuracy >= 60 ? '及格，需要巩固薄弱点' :
                          '不及格，建议重新学习薄弱知识点';

    document.getElementById('correct-count').textContent = correctCount;
    document.getElementById('wrong-count').textContent = wrongCount;
    document.getElementById('accuracy-display').textContent = accuracy + '%';

    // Weak points analysis
    var weakGrid = document.getElementById('weak-grid');
    weakGrid.innerHTML = '';
    var weakList = [];
    Object.keys(TOPIC_WEIGHTS).forEach(function(topic) {
      var info = TOPIC_WEIGHTS[topic];
      var rate = info.total > 0 ? Math.round((info.correct / info.total) * 100) : 0;
      var cls = rate >= 80 ? 'strong' : (rate >= 50 ? 'medium' : '');
      var label = rate >= 80 ? '掌握良好' : (rate >= 50 ? '需加强' : '薄弱');
      weakList.push({ topic: topic, rate: rate, cls: cls, label: label });
    });
    weakList.sort(function(a, b) { return a.rate - b.rate; });
    weakList.forEach(function(item) {
      weakGrid.innerHTML += '<span class="weak-chip ' + item.cls + '">' + item.topic + ' — ' + item.label + ' (' + item.rate + '%)</span>';
    });

    // Review items
    var reviewEl = document.getElementById('review-items');
    var reviewHtml = '';
    QUESTIONS.forEach(function(q, i) {
      var userAns = state.answers[q.id];
      var isCorrect;
      if (q.type === 'choice') {
        if (q.multi) {
          if (Array.isArray(userAns) && Array.isArray(q.answer) && userAns.length === q.answer.length) {
            var sortedUser = userAns.slice().sort();
            var sortedAns = q.answer.slice().sort();
            isCorrect = sortedUser.every(function(v, idx) { return v === sortedAns[idx]; });
          } else { isCorrect = false; }
        } else {
          isCorrect = userAns === q.answer;
        }
      } else {
        if (userAns && userAns.trim().length > 0) {
          var lower = userAns.toLowerCase();
          var matchCount = 0;
          q.keywords.forEach(function(kw) {
            if (lower.indexOf(kw.toLowerCase()) !== -1) matchCount++;
          });
          isCorrect = matchCount >= Math.ceil(q.keywords.length * 0.5);
        } else { isCorrect = false; }
      }
      var userDisplay;
      if (q.type === 'choice') {
        if (q.multi && Array.isArray(userAns)) {
          userDisplay = userAns.map(function(idx) { return q.options[idx]; }).join('、') || '（未作答）';
        } else if (userAns !== undefined && userAns !== null && userAns !== '') {
          userDisplay = q.options[userAns] || '（未作答）';
        } else { userDisplay = '（未作答）'; }
      } else {
        userDisplay = userAns && userAns.trim() ? userAns : '（未作答）';
      }
      var ansDisplay = q.type === 'text' ? q.answer : (q.multi ? q.answer.map(function(i) { return q.options[i]; }).join('、') : q.options[q.answer]);
      if (!ansDisplay) ansDisplay = '—';
      reviewHtml += '<div class="review-item">';
      reviewHtml += '<span class="review-idx ' + (isCorrect ? 'idx-right' : 'idx-wrong') + '">' + (i + 1) + '</span>';
      reviewHtml += '<div class="review-body">';
      reviewHtml += '<div class="q">' + q.text + '</div>';
      reviewHtml += '<div class="a">你的回答：<strong>' + userDisplay + '</strong></div>';
      if (!isCorrect) {
        reviewHtml += '<div class="a" style="color:var(--success);">正确答案：<strong>' + ansDisplay + '</strong></div>';
      }
      reviewHtml += '</div></div>';
    });
    reviewEl.innerHTML = reviewHtml;

    resultsPanel.classList.add('show');
    btnSubmit.style.display = 'none';
    btnReset.style.display = '';
    progressFill.style.width = '100%';
    progressText.textContent = state.total + ' / ' + state.total;

    // ---- Sync results to backend ----
    var weakAreasList = [];
    Object.keys(TOPIC_WEIGHTS).forEach(function(topic) {
      var info = TOPIC_WEIGHTS[topic];
      var rate = info.total > 0 ? Math.round((info.correct / info.total) * 100) : 0;
      if (rate < 80) {
        weakAreasList.push({ topic: topic, rate: rate });
      }
    });

    var syncData = {
      title: '六年级上册语文 - 古诗词三首（Day 1）',
      date: new Date().toISOString(),
      score: accuracy,
      correctCount: correctCount,
      totalQuestions: state.total,
      weakAreas: weakAreasList,
      details: QUESTIONS.map(function(q, i) {
        var userAns = state.answers[q.id];
        var isCorrect = false;
        if (q.type === 'choice') {
          if (q.multi) {
            if (Array.isArray(userAns) && Array.isArray(q.answer) && userAns.length === q.answer.length) {
              var sortedUser = userAns.slice().sort();
              var sortedAns = q.answer.slice().sort();
              isCorrect = sortedUser.every(function(v, i) { return v === sortedAns[i]; });
            }
          } else {
            isCorrect = userAns === q.answer;
          }
        } else {
          if (userAns && userAns.trim().length > 0) {
            var lower = userAns.toLowerCase();
            var matchCount = 0;
            q.keywords.forEach(function(kw) {
              if (lower.indexOf(kw.toLowerCase()) !== -1) matchCount++;
            });
            isCorrect = matchCount >= Math.ceil(q.keywords.length * 0.5);
          }
        }
        return {
          question: q.text,
          type: q.type,
          userAnswer: userAns,
          isCorrect: isCorrect
        };
      })
    };

    // Save to localStorage
    var history = JSON.parse(localStorage.getItem('quiz-history') || '[]');
    history.push(syncData);
    localStorage.setItem('quiz-history', JSON.stringify(history));

    // Sync to backend
    fetch('http://localhost:8765/api/quiz-results', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(syncData)
    }).then(function(response) {
      if (response.ok) {
        console.log('✅ Results synced to backend');
      } else {
        console.log('⚠️ Backend sync failed:', response.status);
      }
    }).catch(function(err) {
      console.log('⚠️ Backend sync error:', err);
    });
  });

  // ---- Reset ----
  btnReset.addEventListener('click', function() {
    state.answers = {};
    state.submitted = false;
    state.score = 0;

    Object.keys(TOPIC_WEIGHTS).forEach(function(t) { TOPIC_WEIGHTS[t].correct = 0; });

    resultsPanel.classList.remove('show');
    btnSubmit.style.display = '';
    btnReset.style.display = 'none';

    document.querySelectorAll('.q-card').forEach(function(c) {
      c.classList.remove('correct', 'wrong');
      c.querySelectorAll('.choice').forEach(function(ch) {
        ch.classList.remove('selected', 'correct', 'wrong', 'disabled');
      });
      var sa = c.querySelector('.sa-input');
      if (sa) { sa.disabled = false; sa.value = ''; }
      var fb = c.querySelector('.answer-feedback');
      if (fb) { fb.className = 'answer-feedback'; fb.innerHTML = ''; }
    });

    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

})();
</script>
</body>
</html>
