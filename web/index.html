<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭教师 — 学习中心</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:oklch(98% 0.004 240);
  --surface:oklch(100% 0 0);
  --fg:oklch(20% 0.02 240);
  --muted:oklch(50% 0.018 240);
  --border:oklch(90% 0.006 240);
  --accent:oklch(56% 0.16 220);
  --accent-light:oklch(94% 0.04 220);
  --success:oklch(60% 0.17 155);
  --success-light:oklch(94% 0.04 155);
  --danger:oklch(55% 0.2 25);
  --danger-light:oklch(94% 0.04 25);
  --radius:20px;
  --shadow:0 2px 8px oklch(0% 0 0 / 6%);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  font-size:16px;color:var(--fg);background:var(--bg);line-height:1.6;
}
body{min-height:100vh}

.header{
  position:sticky;top:0;z-index:10;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.header-title{display:flex;align-items:center;gap:10px;font-size:clamp(1.2rem,3vw,1.6rem);font-weight:700;letter-spacing:-0.01em}
.header-title svg{width:32px;height:32px;flex-shrink:0}
.header-badge{font-size:0.75rem;background:var(--accent-light);color:var(--accent);padding:2px 12px;border-radius:999px;font-weight:600}
.header-actions{display:flex;gap:8px}
.header-btn{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.header-btn:hover{background:var(--bg)}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:16px 20px 0;overflow:hidden}
.stat{padding:16px 20px;text-align:center;border-right:1px solid var(--border)}.stat:last-child{border-right:none}
.stat-label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.stat-value{font-size:1.5rem;font-weight:700;color:var(--fg)}
.stat-value.accent{color:var(--accent)}.stat-value.success{color:var(--success)}.stat-value.danger{color:var(--danger)}

.tabs{display:flex;gap:4px;background:var(--surface);padding:8px 20px 0;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;max-width:200px;padding:10px 20px;border:none;border-radius:var(--radius) var(--radius) 0 0;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.2s;background:transparent;color:var(--muted);position:relative}
.tab-btn:hover{color:var(--fg);background:var(--bg)}
.tab-btn.active{color:var(--fg);background:var(--bg)}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}

.content{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.panel{display:none}.panel.active{display:block}

.subject-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.subject-header h2{font-size:clamp(1.3rem,3.5vw,1.8rem);font-weight:700}
.subject-icon{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-light);color:var(--accent)}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:transform 0.2s,box-shadow 0.2s;cursor:pointer;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-shape{position:absolute;top:-12px;right:-12px;width:80px;height:80px;opacity:0.08;pointer-events:none}
.card h3{font-size:1.15rem;font-weight:700;margin-bottom:6px;position:relative;z-index:1}
.card p{font-size:0.9rem;color:var(--muted);line-height:1.5;position:relative;z-index:1}
.card-action{display:inline-block;margin-top:14px;padding:6px 18px;border-radius:999px;font-size:0.85rem;font-weight:600;transition:all 0.2s;position:relative;z-index:1;border:none;cursor:pointer;background:var(--accent-light);color:var(--accent)}
.card-action:hover{background:var(--accent);color:#fff}

.weak-list{list-style:none}
.weak-item{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;transition:background 0.15s}
.weak-item:last-child{border-bottom:none}.weak-item:hover{background:var(--bg)}
.weak-topic{font-size:0.9rem;font-weight:600}
.weak-count{font-size:0.75rem;font-weight:600;color:var(--danger);background:var(--danger-light);padding:3px 10px;border-radius:999px}

.quiz-q{padding:16px 20px;border-bottom:1px solid var(--border)}.quiz-q:last-child{border-bottom:none}
.quiz-q-text{font-size:0.95rem;font-weight:600;margin-bottom:12px}
.quiz-opt{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:4px 0;border-radius:8px;cursor:pointer;transition:background 0.15s;font-size:0.9rem;color:var(--muted)}
.quiz-opt:hover{background:var(--bg)}
.quiz-opt input[type="radio"]{accent-color:var(--accent);width:16px;height:16px}
.quiz-result{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:0.8rem;font-weight:600}
.quiz-result.correct{background:var(--success-light);color:var(--success)}
.quiz-result.wrong{background:var(--danger-light);color:var(--danger)}

.msg{padding:10px 14px;border-radius:10px;font-size:0.85rem;font-weight:500;margin:12px 0}
.msg-info{background:var(--accent-light);color:var(--accent)}
.msg-success{background:var(--success-light);color:var(--success)}
.msg-warn{background:var(--danger-light);color:var(--danger)}

.btn{padding:10px 20px;border-radius:999px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s;border:none}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:oklch(50% 0.16 220)}
.btn-danger{background:var(--danger-light);color:var(--danger)}.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg);color:var(--fg)}

.hidden{display:none}

/* upload zone */
.upload-zone{
  border:2px dashed var(--border);border-radius:var(--radius);
  padding:32px 24px;text-align:center;cursor:pointer;
  transition:all 0.2s;background:var(--surface);
}
.upload-zone:hover,.upload-zone.dragover{
  border-color:var(--accent);background:var(--accent-light);
}
.upload-zone svg{width:40px;height:40px;margin-bottom:8px;color:var(--muted)}
.upload-zone.dragover svg{color:var(--accent)}
.upload-zone h4{font-size:0.95rem;font-weight:600;margin-bottom:4px}
.upload-zone p{font-size:0.8rem;color:var(--muted)}
.upload-zone .formats{font-size:0.7rem;color:var(--muted);margin-top:8px}
.upload-list{margin-top:12px;text-align:left}
.upload-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-radius:8px;background:var(--bg);margin:4px 0;font-size:0.85rem;
}
.upload-item .name{flex:1;font-weight:500}
.upload-item .size{color:var(--muted);font-size:0.75rem}
.upload-item .status{font-size:0.75rem;font-weight:600}
.upload-item .status.ok{color:var(--success)}
.upload-item .status.err{color:var(--danger)}
.upload-item .status.uploading{color:var(--accent)}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:0.4}
.empty-state h3{font-size:1.2rem;font-weight:700;color:var(--fg);margin-bottom:8px}
.empty-state p{font-size:0.9rem;max-width:400px;margin:0 auto 20px}
.empty-state .btn{margin-top:8px}

.footer{text-align:center;padding:24px 20px 40px;color:var(--muted);font-size:0.8rem;border-top:1px solid var(--border);margin-top:20px}

@media(max-width:640px){
  .stats-bar{grid-template-columns:repeat(2,1fr);margin:12px 12px 0}
  .tabs{padding:8px 12px 0}.tab-btn{font-size:0.9rem;padding:8px 12px;max-width:none}
  .content{padding:16px 12px 40px}.card{padding:18px}.header{padding:10px 12px}
}
@media(min-width:768px){.card-grid{gap:20px}}
</style>
</head>
<body>

<header class="header">
  <div class="header-title">
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="15" fill="oklch(56% 0.16 220 / 12%)"/>
      <path d="M10 16l4 4 8-8" stroke="oklch(56% 0.16 220)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>家庭教师</span>
    <span class="header-badge" id="grade-badge" style="display:none"></span>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="refreshData()">↻ 刷新</button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-label">课程数</div><div class="stat-value" id="stat-courses">0</div></div>
  <div class="stat"><div class="stat-label">测验题数</div><div class="stat-value accent" id="stat-quizzes">0</div></div>
  <div class="stat"><div class="stat-label">正确率</div><div class="stat-value success" id="stat-accuracy">—</div></div>
  <div class="stat"><div class="stat-label">薄弱知识点</div><div class="stat-value danger" id="stat-weak">0</div></div>
</div>

<div class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="learn" onclick="switchTab('learn')">学习</button>
  <button class="tab-btn" data-tab="review" onclick="switchTab('review')">查漏补缺</button>
</div>

<main class="content">

<!-- 学习面板 -->
<div class="panel active" id="panel-learn">

  <!-- 空状态：未上传课本 -->
  <div id="empty-state">
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.rar,.txt,.md,.html,.htm,.jpg,.jpeg,.png" style="display:none" onchange="handleFiles(this.files)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <h4>拖拽文件到这里上传</h4>
      <p>或点击选择文件</p>
      <div class="formats">支持 PDF · Word · PPT · Excel · ZIP · 图片 · TXT · Markdown</div>
    </div>
    <div id="upload-list" class="upload-list"></div>
    <div style="text-align:center;margin-top:16px;color:var(--muted);font-size:0.85rem">
      上传后课本会自动解析，也可以直接在下方输入想学的内容。
    </div>
  </div>

  <!-- 已有学习计划：显示课程卡片 -->
  <div id="plan-state" class="hidden">
    <div class="subject-header">
      <div class="subject-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
        </svg>
      </div>
      <h2 id="plan-title">今日课程</h2>
    </div>
    <div class="card-grid" id="plan-cards"></div>
  </div>

  <!-- 通用上课入口 -->
  <div style="margin-top:24px">
    <div class="card" style="padding:20px">
      <h3 style="margin-bottom:8px">🎓 自由学习</h3>
      <p style="margin-bottom:12px">输入任何想学的内容，AI老师会为你生成课程。</p>
      <div style="display:flex;gap:8px">
        <input type="text" id="free-topic" placeholder="如：三年级数学·分数加减法" style="flex:1;padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:0.9rem;outline:none">
        <button class="btn btn-primary" onclick="startFreeClassroom()">开始上课</button>
      </div>
    </div>
  </div>
</div>

<!-- 查漏补缺面板 -->
<div class="panel" id="panel-review">
  <div class="subject-header">
    <div class="subject-icon" style="background:var(--danger-light);color:var(--danger)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v4"/><circle cx="12" cy="17" r="0.5"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      </svg>
    </div>
    <h2>查漏补缺</h2>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn btn-danger" onclick="generateWeakReview()">🎯 针对薄弱点生成强化课堂</button>
    <button class="btn btn-ghost" onclick="startQuiz()">📝 综合测验</button>
  </div>

  <div class="card" style="padding:0">
    <ul class="weak-list" id="weak-list">
      <li class="weak-item"><span class="weak-topic" style="color:var(--muted)">暂无数据，先去上课做题吧</span></li>
    </ul>
  </div>

  <div id="quiz-section" class="hidden" style="margin-top:16px">
    <div class="card" style="padding:0" id="quiz-content"></div>
    <div id="quiz-submit" class="hidden" style="margin-top:12px">
      <button class="btn btn-primary" onclick="submitQuiz()">✅ 提交答卷</button>
    </div>
    <div id="quiz-result" class="hidden" style="margin-top:12px"></div>
  </div>

  <div id="review-status"></div>
</div>

</main>

<footer class="footer">家庭教师 · AI驱动的学习伙伴</footer>

<script>
const OT = 'http://localhost:8000';
const OM = 'http://localhost:3000';

function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+t));
}

// 打开OpenMAIC课堂
function openClassroom(topic){
  window.open(OM+'?topic='+encodeURIComponent(topic),'_blank');
}

// 自由学习
function startFreeClassroom(){
  const topic=document.getElementById('free-topic').value.trim();
  if(!topic)return;
  openClassroom('请讲解：'+topic);
}

// 刷新数据
async function refreshData(){
  try{
    const r=await fetch(OT+'/api/bridge/progress-summary');
    if(r.ok){
      const d=await r.json();
      document.getElementById('stat-courses').textContent=d.course_count||0;
      document.getElementById('stat-quizzes').textContent=d.total_questions||0;
      document.getElementById('stat-accuracy').textContent=d.accuracy!=null?Math.round(d.accuracy*100)+'%':'—';
      document.getElementById('stat-weak').textContent=d.weak_topic_count||0;
    }
  }catch(e){}

  try{
    const r=await fetch(OT+'/api/bridge/review-topic');
    if(r.ok){
      const d=await r.json();
      const list=document.getElementById('weak-list');
      if(d.weak_areas&&d.weak_areas.length>0){
        list.innerHTML=d.weak_areas.map(w=>`
          <li class="weak-item">
            <span class="weak-topic">${w.question||'未知'}</span>
            <span class="weak-count">${w.error_count}次错误</span>
          </li>
        `).join('');
      }
    }
  }catch(e){}

  // 检查是否有学习计划
  try{
    const r=await fetch(OT+'/api/courses');
    if(r.ok){
      const courses=await r.json();
      if(courses&&courses.length>0){
        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('plan-state').classList.remove('hidden');
        document.getElementById('plan-title').textContent='当前课程';
        document.getElementById('plan-cards').innerHTML=courses.map(c=>`
          <div class="card" onclick="openClassroom('继续学习：${c.name||'课程'}')">
            <h3>${c.name||'未命名课程'}</h3>
            <p>${c.description||'点击继续学习'}</p>
            <button class="card-action">继续学习</button>
          </div>
        `).join('');
      }
    }
  }catch(e){}
}

// 针对薄弱点生成强化课堂
async function generateWeakReview(){
  const s=document.getElementById('review-status');
  s.innerHTML='<div class="msg msg-info">正在分析薄弱点...</div>';
  try{
    const r=await fetch(OT+'/api/bridge/review-topic');
    if(!r.ok)throw new Error();
    const d=await r.json();
    if(!d.topic){s.innerHTML='<div class="msg msg-warn">'+(d.message||'暂无薄弱点数据')+'</div>';return;}
    s.innerHTML='<div class="msg msg-info">正在打开强化课堂...</div>';
    openClassroom(d.topic);
    setTimeout(()=>s.innerHTML='',3000);
  }catch(e){s.innerHTML='<div class="msg msg-warn">无法连接学习系统</div>';}
}

// 测验
let currentQuiz=null,answers={};
async function startQuiz(){
  const sec=document.getElementById('quiz-section');
  const con=document.getElementById('quiz-content');
  sec.classList.remove('hidden');
  document.getElementById('quiz-submit').classList.add('hidden');
  document.getElementById('quiz-result').classList.add('hidden');
  con.innerHTML='<div class="msg msg-info">正在生成测验题...</div>';
  answers={};
  try{
    const courses=await fetch(OT+'/api/courses').then(r=>r.json());
    if(!courses?.length){con.innerHTML='<div class="msg msg-warn">还没有学习记录，请先上课。</div>';return;}
    const q=await fetch(OT+'/api/quiz/'+courses[0].id+'/next?count=5').then(r=>r.json());
    if(!q?.problems?.length){con.innerHTML='<div class="msg msg-warn">暂无测验题。</div>';return;}
    currentQuiz=q;
    con.innerHTML=q.problems.map((p,i)=>`
      <div class="quiz-q">
        <div class="quiz-q-text">${i+1}. ${p.question}</div>
        ${p.options?p.options.map((o,j)=>`
          <label class="quiz-opt"><input type="radio" name="q${i}" value="${j}" onchange="answers[${i}]='${j}'">${o}</label>
        `).join(''):''}
        <div id="qr-${i}" class="quiz-result hidden"></div>
      </div>
    `).join('');
    document.getElementById('quiz-submit').classList.remove('hidden');
  }catch(e){con.innerHTML='<div class="msg msg-warn">连接失败</div>';}
}

async function submitQuiz(){
  if(!currentQuiz)return;
  let correct=0,total=currentQuiz.problems.length;
  currentQuiz.problems.forEach((p,i)=>{
    const ok=answers[i]===String(p.correct_answer);
    if(ok)correct++;
    const el=document.getElementById('qr-'+i);
    el.classList.remove('hidden');
    el.className='quiz-result '+(ok?'correct':'wrong');
    el.textContent=ok?'✓ 正确':'✗ 错误 · 正确答案：'+p.correct_answer;
  });
  const pct=Math.round(correct/total*100);
  const rd=document.getElementById('quiz-result');
  rd.classList.remove('hidden');
  rd.innerHTML=`<div class="msg ${pct>=80?'msg-success':'msg-warn'}" style="text-align:center;font-size:1.1rem">得分：${pct}%（${correct}/${total}）${pct>=80?' 🎉':' 💪'}</div>
    ${pct<80?'<div style="text-align:center;margin-top:8px"><button class="btn btn-danger" onclick="generateWeakReview()">🎯 针对弱点复习</button></div>':''}`;
  const cid=currentQuiz.course_id||currentQuiz.problems[0]?.course_id;
  if(cid)fetch(OT+'/api/quiz/'+cid+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:currentQuiz.problems.map((p,i)=>({problem_id:p.id,answer:answers[i]||''}))})}).catch(()=>{});
  setTimeout(refreshData,1000);
}

refreshData();

// === 文件上传 ===
const uploadZone = document.getElementById('upload-zone');
const fileInput = document.getElementById('file-input');

// 拖拽事件
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', e => { e.preventDefault(); uploadZone.classList.remove('dragover'); });
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
});

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

async function handleFiles(files) {
  const list = document.getElementById('upload-list');
  const items = [];

  for (const file of files) {
    const id = 'f-' + Math.random().toString(36).slice(2);
    items.push({ id, file });
    list.innerHTML += `<div class="upload-item" id="${id}">
      <span class="name">${file.name}</span>
      <span class="size">${formatSize(file.size)}</span>
      <span class="status uploading">上传中...</span>
    </div>`;
  }

  // 先创建一个课程
  let courseId = null;
  try {
    const cr = await fetch(OT+'/api/courses', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name: '上传资料 - ' + new Date().toLocaleDateString() })
    });
    if (cr.ok) {
      const cd = await cr.json();
      courseId = cd.id;
    }
  } catch(e) {}

  for (const { id, file } of items) {
    const el = document.getElementById(id);
    const statusEl = el.querySelector('.status');

    try {
      if (!courseId) throw new Error('无法创建课程');

      const fd = new FormData();
      fd.append('file', file);
      fd.append('course_id', courseId);

      const r = await fetch(OT+'/api/content/upload', { method: 'POST', body: fd });

      if (r.ok) {
        statusEl.textContent = '✓ 完成';
        statusEl.className = 'status ok';
      } else {
        const err = await r.json().catch(() => ({}));
        throw new Error(err.detail || err.message || '上传失败');
      }
    } catch(e) {
      statusEl.textContent = '✗ ' + (e.message || '失败');
      statusEl.className = 'status err';
    }
  }

  // 上传完成后刷新
  setTimeout(refreshData, 2000);
}
</script>
</body>
</html>
